[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "uavdet"
version = "0.2.0"
description = "Small object detection and multi-object tracking in UAV imagery: sliced inference, size-aware evaluation, ByteTrack."
authors = [{ name = "Şule Özdamar" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "ultralytics>=8.3.0", "sahi>=0.11.18", "opencv-python", "numpy", "scipy", "pandas", "matplotlib",
  "pyyaml", "pycocotools", "motmetrics>=1.4", "lap",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E731", "B905"]
